<!doctype html><html lang="ko"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>H1 회전 메치기 연결 검수</title>
<style>
body{margin:0;background:#111923;color:#e9eff6;font:15px system-ui}main{max-width:1050px;margin:auto;padding:18px}h1{font-size:25px;margin:0 0 6px}p{margin:6px 0 12px;color:#b0c1d4}a{color:#7be0ca}button,select,input{font:inherit}button,select{background:#293b50;color:#edf4fd;border:1px solid #51677f;border-radius:5px;padding:7px}label{display:inline-flex;gap:7px;align-items:center}.controls{display:flex;gap:9px;flex-wrap:wrap;margin:10px 0}.viewport{aspect-ratio:1280/720;position:relative;overflow:hidden;background:#192634;border:1px solid #405268}.world{position:absolute;width:1280px;height:720px;transform-origin:0 0}.floor{position:absolute;left:0;top:600px;width:100%;height:120px;border-top:2px solid #8497ac;background:#233446}.sprite{position:absolute;width:320px;height:320px}.name,.root{position:absolute;z-index:10}.name{font:16px monospace;transform:translate(-50%,-100%)}.root{width:16px;height:2px;background:#78dccb;transform:translateX(-50%)}#frame{flex:1;min-width:200px}output{display:block;font:14px monospace;padding:8px;background:#203044;line-height:1.5}small{color:#a9b9cc}
</style><main><h1>회전 메치기 · 성공과 풀기</h1><p>정해진 입력을 공통 전투에 전달하는 연결 검수입니다. <a href="/combat.html">실제 키로 조작하기 →</a></p>
<div class="controls"><label>상황<select id="scenario"><option value="throw">메치기 성공</option><option value="crouch">앉은 상대 메치기</option><option value="tech0">잡히는 순간 풀기 H0</option><option value="tech12">마지막 허용 풀기 H12</option><option value="tech13">늦은 풀기 H13</option><option value="ko">메치기 KO</option></select></label><label>거리<select id="distance"><option>72</option><option selected>84</option><option>96</option></select></label><label>방향<select id="facing"><option value="1">오른쪽으로</option><option value="-1">왼쪽으로</option></select></label><label>위치<select id="location"><option value="center">중앙</option><option value="left">왼쪽 경계</option><option value="right">오른쪽 경계</option></select></label></div>
<div class="viewport"><div class="world" id="world"><div class="floor"></div></div></div>
<div class="controls"><button id="play">재생</button><button id="prev">이전 1F</button><button id="next">다음 1F</button><input id="frame" type="range" min="0" max="110" value="0" aria-label="검수 프레임"></div>
<div class="controls"><button data-frame="7">붙잡음 H0</button><button data-frame="20">회전 H13</button><button data-frame="31">공중 H24</button><button data-frame="43">바닥 충돌 H36</button><button data-frame="55">기상 H48</button><button data-frame="79">행동 복귀 H72</button></div>
<output id="state"></output><small>초록 선은 논리 발 기준점. 공중 그림의 표시 변환은 실제 판정 위치를 바꾸지 않습니다. 이 화면의 입력 시나리오는 사람의 실제 조작 검수와 구분합니다.</small></main>
<script type="module">
import {createCombat,stepCombat,COMBAT_NEUTRAL as N} from '../../../src/combat/combat.ts';
import {H1_POSES,combatPose} from '../../../src/characters/h1-poses.ts';
import {combatVisual} from '../../../src/characters/h1-visual.ts';
const $=id=>document.getElementById(id),world=$('world');
const images=[0,1].map(i=>{const image=new Image();image.className='sprite';image.alt=i?'대상':'공격자';world.append(image);return image});
const labels=[0,1].map(()=>{const el=document.createElement('span');el.className='name';world.append(el);return el});
const roots=[0,1].map(()=>{const el=document.createElement('i');el.className='root';world.append(el);return el});
const chord=()=>({...N,attacks:['lp','hp'],handEvents:[{slot:'lp',down:true},{slot:'hp',down:true},{slot:'hp',down:false},{slot:'lp',down:false}]});
let states=[],playing=false,last=0,acc=0;
function rebuild(){
 playing=false;$('play').textContent='재생';
 let s=createCombat();const d=Number($('distance').value),dir=Number($('facing').value),loc=$('location').value,kind=$('scenario').value;
 const a=loc==='left'?(dir===1?80:80+d):loc==='right'?(dir===1?1200-d:1200):640-dir*d/2;
 s.fighters[0].x=a;s.fighters[1].x=a+dir*d;if(kind==='ko')s.fighters[1].hp=18;
 states=[s];for(let t=0;t<110;t++){
  const tech=kind==='tech0'?6:kind==='tech12'?18:kind==='tech13'?19:-1;
  s=stepCombat(s,[t===0?chord():N,t===tech?chord():{...N,crouch:kind==='crouch'}]);states.push(s);
 }
 $('frame').value='0';draw();
}
function draw(){
 const index=Number($('frame').value),s=states[index];
 for(let i=0;i<2;i++){
  const f=s.fighters[i],def=s.definitions[i],pose=combatPose(f,def,Math.max(0,index-43)),v=combatVisual(f,def);
  images[i].src='../../../assets/characters/h1/derived/'+H1_POSES[pose];
  Object.assign(images[i].style,{left:(v.x-160)+'px',top:(v.y-320*v.originY)+'px',transformOrigin:`50% ${v.originY*100}%`,transform:`rotate(${v.angle}deg) scaleX(${f.facing})`,zIndex:v.depth});
  labels[i].textContent=`${i?'대상':'공격자'} ${f.hp}HP`;
  Object.assign(labels[i].style,{left:v.x+'px',top:(v.y-v.labelHeight)+'px'});
  Object.assign(roots[i].style,{left:f.x+'px',top:f.y+'px'});
 }
 $('state').textContent=`표시F${index} · 전투F${s.frame} · ${s.grabEvents.map(e=>e.kind+' 피해'+e.damage).join(' / ') || '사건 없음'}\n`+s.fighters.map((f,i)=>`${i?'대상':'공격자'} ${f.action} · ${f.grab?.kind??'—'} ${f.grab?.age??'—'}F · ${combatPose(f,s.definitions[i])}`).join(' / ');
}
function step(amount){playing=false;$('play').textContent='재생';$('frame').value=String(Math.max(0,Math.min(110,Number($('frame').value)+amount)));draw()}
for(const id of ['scenario','distance','facing','location'])$(id).addEventListener('change',rebuild);
$('frame').addEventListener('input',()=>step(0));$('prev').addEventListener('click',()=>step(-1));$('next').addEventListener('click',()=>step(1));
for(const b of document.querySelectorAll('[data-frame]'))b.addEventListener('click',()=>{$('frame').value=b.dataset.frame;step(0)});
$('play').addEventListener('click',()=>{playing=!playing;acc=0;last=performance.now();if(Number($('frame').value)===110)$('frame').value='0';$('play').textContent=playing?'정지':'재생'});
new ResizeObserver(entries=>{world.style.transform=`scale(${entries[0].contentRect.width/1280})`}).observe(world.parentElement);
function animate(now){if(playing){acc+=Math.min(100,now-last);while(acc>=1000/60){acc-=1000/60;$('frame').value=String(Math.min(110,Number($('frame').value)+1));if(Number($('frame').value)===110){playing=false;$('play').textContent='재생';break}}draw()}last=now;requestAnimationFrame(animate)}
rebuild();requestAnimationFrame(animate);
</script></html>
