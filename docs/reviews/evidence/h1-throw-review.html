<!doctype html><html lang="ko"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>H1 회전 메치기 연결 검수</title>
<style>
body{margin:0;background:#111923;color:#e9eff6;font:15px system-ui}main{max-width:1050px;margin:auto;padding:18px}h1{font-size:25px;margin:0 0 6px}p{margin:6px 0 12px;color:#b0c1d4}a{color:#7be0ca}button,select,input{font:inherit}button,select{background:#293b50;color:#edf4fd;border:1px solid #51677f;border-radius:5px;padding:7px}label{display:inline-flex;gap:7px;align-items:center}.controls{display:flex;gap:9px;flex-wrap:wrap;margin:10px 0}.controls[hidden]{display:none}.viewport{aspect-ratio:1280/720;position:relative;overflow:hidden;background:#192634;border:1px solid #405268}.world{position:absolute;width:1280px;height:720px;transform-origin:0 0}.floor{position:absolute;left:0;top:600px;width:100%;height:120px;border-top:2px solid #8497ac;background:#233446}.camera-layer{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:640px 600px;z-index:0}.sprite{position:absolute;width:320px;height:320px}.name,.root{position:absolute;z-index:10}.name{font:16px monospace;transform:translate(-50%,-100%)}.root{width:16px;height:2px;background:#78dccb;transform:translateX(-50%)}#frame{flex:1;min-width:200px}output{display:block;font:14px monospace;padding:8px;background:#203044;line-height:1.6;white-space:pre-wrap}small{color:#a9b9cc;line-height:1.5}
</style><main><h1>회전 메치기 · 성공과 풀기</h1><p>초기 위치·체력을 지정하고 정해진 입력을 공통 전투에 전달하는 검수입니다. 실제 키 조작·청취·난이도 체감 검수와 구분합니다. <a href="/combat.html">실제 키로 조작하기 →</a></p>
<div class="controls"><label>상황<select id="scenario"><option value="throw">메치기 성공</option><option value="crouch">앉은 상대 메치기</option><option value="tech0">잡히는 순간 풀기 H0</option><option value="tech12">마지막 허용 풀기 H12</option><option value="tech13">늦은 풀기 H13</option><option value="ko">메치기 KO</option><option value="idle">서서 대기 · 두 포즈 비교</option><option value="idle-crouch">앉아서 대기</option></select></label><label>거리<select id="distance"><option>72</option><option selected>84</option><option>96</option></select></label><label>방향<select id="facing"><option value="1">오른쪽으로</option><option value="-1">왼쪽으로</option></select></label><label>위치<select id="location"><option value="center">중앙</option><option value="left">왼쪽 경계</option><option value="right">오른쪽 경계</option></select></label><label><input id="before" type="checkbox">보정 전 보기</label></div>
<div class="viewport"><div class="world" id="world"><div class="floor"></div></div></div>
<div class="controls"><button id="play">재생</button><button id="prev">이전 1F</button><button id="next">다음 1F</button><input id="frame" type="range" min="0" max="110" value="0" aria-label="검수 프레임"></div>
<div class="controls" id="throw-milestones"><button data-frame="7">붙잡음 H0</button><button data-frame="20">회전 H13</button><button data-frame="31">공중 H24</button><button data-frame="43">바닥 충돌 H36</button><button data-frame="55">기상 H48</button><button data-frame="60">공격자 복귀 직전 H53</button><button data-frame="61">공격자 복귀 H54</button><button data-frame="78">대상 복귀 직전 H71</button><button data-frame="79">대상 복귀 H72</button></div>
<div class="controls" id="idle-milestones" hidden><button data-frame="0">대기 F0</button><button data-frame="15">대기 F15</button><button data-frame="30">대기 F30</button></div>
<output id="state"></output><small>초록 선은 논리 발 기준점. 그림·이름표·논리 발 기준점에 제품과 같은 A 공통 카메라를 적용합니다. 실제 전투 상태는 바꾸지 않습니다. ‘보정 전 보기’는 이전136px 보정이 있던8ab001c의 표시만 카메라 확대/이동 없이 재현합니다. 코너·거리·방향을 바꿔도 현재 프레임을 유지합니다.</small></main>
<script type="module">
import {createCombat,stepCombat,grabPoseState,COMBAT_NEUTRAL as N} from '../../../src/combat/combat.ts';
import {STAGE} from '../../../src/combat/movement.ts';
import {H1_POSES,combatPose} from '../../../src/characters/h1-poses.ts';
import {combatVisuals} from '../../../src/characters/h1-visual.ts';
import {combatCamera,worldToScreen} from '../../../src/characters/h1-camera.ts';
// Frozen display baseline: git 8ab001c:src/characters/h1-visual.ts.
// Only TypeScript declarations and local function/table names were changed.
// Alpha > 0 pixel-cell edges in the 512px source PNGs; right is exclusive.
// Tests compare the displayed extent with the actual PNG alpha after every asset change.
const oldReactionBounds = {
  'stand-hit': [53, 416], 'crouch-hit': [113, 379],
  'ko-0': [74, 422], 'ko-1': [47, 466], 'ko-2': [49, 466],
};

/** Display-only transforms. Logical roots, facing and collision positions never move here. */
function oldVisual(f, def, koFrame = 0) {
  const g = grabPoseState(f);
  const result = { x: f.x, y: f.action === 'ko' ? STAGE.floor : f.y, angle: 0,
    originY: 0.875, depth: f.id, labelHeight: f.action === 'ko' ? 125 : f.posture === 'crouch' ? 162 : 255 };
  if (g?.kind !== 'success') {
    if (f.action === 'hit' || f.action === 'ko') {
      const bounds = oldReactionBounds[combatPose(f, def, koFrame)];
      if (bounds) {
        const a = (bounds[0] - 256) * 0.625 * f.facing;
        const b = (bounds[1] - 256) * 0.625 * f.facing;
        result.x = Math.max(-Math.min(a, b), Math.min(1280 - Math.max(a, b), result.x));
      }
    }
    return result;
  }
  const impact = g.impactAt ?? def.grab.impact, turn = (g.techUntil ?? def.grab.techWindow) + 1;
  const lift = Math.min(impact, turn + Math.max(1, Math.floor((impact - turn) / 3)));
  if (g.role === 'attacker') {
    result.depth = g.age < lift ? 3 : 1;
    return result;
  }
  result.depth = g.age >= lift ? 4 : 2;
  // The adopted throw silhouettes extend at most 134px from their displayed center.
  // Keep their body visible at arena edges without changing the collision/landing root.
  const keepBodyOnStage = () => { result.x = Math.max(136, Math.min(1280 - 136, result.x)); };
  if (g.age >= impact) {
    const recovery = Math.max(1, g.releaseAt - impact);
    result.labelHeight = f.action === 'ko' || g.age < impact + recovery / 3 ? 105
      : g.age < impact + recovery * 2 / 3 ? 170 : f.posture === 'crouch' ? 162 : 255;
    keepBodyOnStage();
    if (f.action !== 'ko' && g.age >= impact + recovery / 3) {
      const upright = (g.age - impact - recovery / 3) / (recovery * 2 / 3);
      result.x += (f.x - result.x) * upright;
    }
    return result;
  }
  if (g.age < turn) return result;
  const progress = (g.age - turn) / (impact - turn);
  // A landing advances the logical root by 48; the airborne drawing approaches it smoothly.
  const push = g.pushDistance ?? def.grab.push;
  const landingX = Math.max(STAGE.minX, Math.min(STAGE.maxX, f.x - f.facing * push));
  result.x += f.facing * 32 * Math.sin(Math.PI * progress) + (landingX - f.x) * progress * progress;
  result.y -= 70 * Math.sin(Math.PI * progress);
  if (g.age < lift) result.angle = f.facing * 20 * (g.age - turn) / Math.max(1, lift - turn);
  else {
    const flight = (g.age - lift) / Math.max(1, impact - lift);
    // Rotate around the airborne body's center, not around its former feet.
    result.originY = 0.5;
    result.y -= 120 - 60 * flight;
    result.angle = f.facing * (-45 + 120 * flight);
    result.labelHeight = 130;
    keepBodyOnStage();
  }
  return result;
}
const $=id=>document.getElementById(id),world=$('world');
const layer=document.createElement('div');layer.className='camera-layer';world.append(layer);
const images=[0,1].map(i=>{const image=new Image();image.className='sprite';image.alt=i?'대상':'공격자';layer.append(image);return image});
const labels=[0,1].map(()=>{const el=document.createElement('span');el.className='name';layer.append(el);return el});
const roots=[0,1].map(()=>{const el=document.createElement('i');el.className='root';layer.append(el);return el});
const chord=()=>({...N,attacks:['lp','hp'],handEvents:[{slot:'lp',down:true},{slot:'hp',down:true},{slot:'hp',down:false},{slot:'lp',down:false}]});
let states=[],playing=false,last=0,acc=0;
function rebuild(){
 playing=false;$('play').textContent='재생';
 const previousFrame=Number($('frame').value);
 let s=createCombat();const d=Number($('distance').value),dir=Number($('facing').value),loc=$('location').value,kind=$('scenario').value;
 const idle=kind.startsWith('idle');$('throw-milestones').hidden=idle;$('idle-milestones').hidden=!idle;
 const a=loc==='left'?(dir===1?80:80+d):loc==='right'?(dir===1?1200-d:1200):640-dir*d/2;
 s.fighters[0].x=a;s.fighters[1].x=a+dir*d;if(kind==='ko')s.fighters[1].hp=18;
 // Resolve facing through a common neutral tick before display F0, so mirrored idle comparisons start facing each other.
 s=stepCombat(s,[{...N,crouch:kind==='idle-crouch'},{...N,crouch:kind==='crouch'||kind==='idle-crouch'}]);
 states=[s];for(let t=0;t<110;t++){
  const tech=kind==='tech0'?6:kind==='tech12'?18:kind==='tech13'?19:-1;
  s=stepCombat(s,[idle?{...N,crouch:kind==='idle-crouch'}:t===0?chord():N,t===tech?chord():{...N,crouch:kind==='crouch'||kind==='idle-crouch'}]);states.push(s);
 }
 $('frame').value=String(previousFrame);draw();
}
function draw(){
 const index=Number($('frame').value),s=states[index];
 const koFrame=Math.max(0,index-43),before=$('before').checked;
 const camera=before?{zoom:1,offsetX:0}:combatCamera(s);
 layer.style.transform=`translateX(${camera.offsetX}px) scale(${camera.zoom})`;
 const visuals=before?s.fighters.map((f,i)=>oldVisual(f,s.definitions[i],koFrame)):combatVisuals(s,koFrame);
 for(let i=0;i<2;i++){
  const f=s.fighters[i],def=s.definitions[i],pose=combatPose(f,def,koFrame),v=visuals[i];
  images[i].src='../../../assets/characters/h1/derived/'+H1_POSES[pose];
  Object.assign(images[i].style,{left:(v.x-160)+'px',top:(v.y-320*v.originY)+'px',transformOrigin:`50% ${v.originY*100}%`,transform:`rotate(${v.angle}deg) scaleX(${f.facing})`,zIndex:v.depth});
  labels[i].textContent=`${i?'대상':'공격자'} ${f.hp}HP`;
  Object.assign(labels[i].style,{left:v.x+'px',top:(v.y-v.labelHeight)+'px'});
  Object.assign(roots[i].style,{left:f.x+'px',top:f.y+'px'});
 }
 const number=x=>x.toFixed(3);
 $('state').textContent=`${before?'보정 전 · 8ab001c':'적용한 A · 공통 카메라'} · 표시F${index} · 전투F${s.frame} · ${s.grabEvents.map(e=>e.kind+' 피해'+e.damage).join(' / ') || '사건 없음'}\n`
  +s.fighters.map((f,i)=>`${i?'대상':'공격자'} ${f.action} · ${f.grab?.kind??f.grabSnapshot?.kind??'—'} ${f.grab?.age??f.grabSnapshot?.age??'—'}F · ${combatPose(f,s.definitions[i],koFrame)} · 논리x ${number(f.x)} / 표시x ${number(worldToScreen(camera,visuals[i].x,visuals[i].y).x)}`).join('\n')
  +`\n논리 간격 ${number(Math.abs(s.fighters[1].x-s.fighters[0].x))} / 표시 간격 ${number(Math.abs(visuals[1].x-visuals[0].x)*camera.zoom)} · 공통 줌 ${(camera.zoom*100).toFixed(3)}%`;
}
function step(amount){playing=false;$('play').textContent='재생';$('frame').value=String(Math.max(0,Math.min(110,Number($('frame').value)+amount)));draw()}
for(const id of ['scenario','distance','facing','location'])$(id).addEventListener('change',rebuild);
$('before').addEventListener('change',()=>step(0));
$('frame').addEventListener('input',()=>step(0));$('prev').addEventListener('click',()=>step(-1));$('next').addEventListener('click',()=>step(1));
for(const b of document.querySelectorAll('[data-frame]'))b.addEventListener('click',()=>{$('frame').value=b.dataset.frame;step(0)});
$('play').addEventListener('click',()=>{playing=!playing;acc=0;last=performance.now();if(Number($('frame').value)===110)$('frame').value='0';$('play').textContent=playing?'정지':'재생'});
new ResizeObserver(entries=>{world.style.transform=`scale(${entries[0].contentRect.width/1280})`}).observe(world.parentElement);
function animate(now){if(playing){acc+=Math.min(100,now-last);while(acc>=1000/60){acc-=1000/60;$('frame').value=String(Math.min(110,Number($('frame').value)+1));if(Number($('frame').value)===110){playing=false;$('play').textContent='재생';break}}draw()}last=now;requestAnimationFrame(animate)}
rebuild();requestAnimationFrame(animate);
</script></html>
